name: Portable package tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  management:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/stack.py install --all --dry-run
      - name: POSIX syntax
        if: runner.os != 'Windows'
        run: for script in scripts/*.sh; do sh -n "$script"; done
      - name: PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts/*.ps1) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
